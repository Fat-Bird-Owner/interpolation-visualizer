<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
    
    </div>
    <h2>Interpolation Renderer</h2>
    <div>
    <hr>
     
    <div id="container">
    <canvas id="canvas" width="600" height="600"></canvas>

    &nbsp;
    
    <div id="config">
      
    <h4>Configurations</h4>
      
    <textarea placeholder="TimeScale Multiplier(ex: 3)" id="interp" cols="30" rows="10"></textarea>
    <br>

      <select id="interpSelect">
  <option value="linear">Linear</option>
  <option value="smooth">Smooth</option>
  <option value="smoother">Smoother</option>
  
  <option value="sineIn">Sine In</option>
  <option value="sineOut">Sine Out</option>
  <option value="sineInOut">Sine In Out</option>
  
  <option value="pow2In">Power 2 In</option>
  <option value="pow2Out">Power 2 Out</option>
  <option value="pow3In">Power 3 In</option>
  <option value="pow3Out">Power 3 Out</option>
  <option value="pow4In">Power 4 In</option>
  <option value="pow4Out">Power 4 Out</option>
  <option value="pow5In">Power 5 In</option>
  <option value="pow5Out">Power 5 Out</option>
  <option value="pow6In">Power 6 In</option>
  <option value="pow6Out">Power 6 Out</option>
  <option value="pow7In">Power 7 In</option>
  <option value="pow7Out">Power 7 Out</option>
  <option value="pow8In">Power 8 In</option>
  <option value="pow8Out">Power 8 Out</option>
  <option value="pow9In">Power 9 In</option>
  <option value="pow9Out">Power 9 Out</option>
  <option value="pow10In">Power 10 In</option>
  <option value="pow10Out">Power 10 Out</option>
  
  <option value="circleIn">Circle In</option>
  <option value="circleOut">Circle Out</option>
  <option value="circleInOut">Circle In Out</option>
  
  <option value="expIn">Exponential In</option>
  <option value="expOut">Exponential Out</option>
  <option value="expInOut">Exponential In Out</option>
  
  <option value="elasticIn">Elastic In</option>
  <option value="elasticOut">Elastic Out</option>
  
  <option value="bounceIn">Bounce In</option>
  <option value="bounceOut">Bounce Out</option>
  <option value="bounceInOut">Bounce In Out</option>
  
  <option value="swingIn">Swing In</option>
  <option value="swingOut">Swing Out</option>
  <option value="swingInOut">Swing In Out</option>
</select>

    <br>
    <button id="reinit">Visualize</button>
    </div></div>
    
    <script src="hjson.js"></script>
    <script src="main.js"></script>
        
</body>

</html>
